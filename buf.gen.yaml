version: v2

plugins:
  - local: protoc-gen-go
    out: backend/internal/generated/pb
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: backend/internal/generated/pb
    opt: paths=source_relative

  - local: protoc-gen-grpc-gateway
    out: backend/internal/generated/pb
    opt: paths=source_relative

  - local: protoc-gen-openapiv2
    out: backend/internal/generated/openapi

  - local: protoc-gen-goclay
    out: backend/internal/generated/pb
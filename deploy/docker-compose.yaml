name: ergoryth

services:
  ergoryth-postgres:
    image: postgres:18-bookworm
    container_name: ergoryth-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  ergoryth-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../backend/migrations:/migrations
    depends_on:
      ergoryth-postgres:
        condition: service_healthy
    profiles:
      - tools
    restart: no

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: ergoryth-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:ergoryth-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data: